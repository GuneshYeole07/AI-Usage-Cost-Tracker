services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm_token_auditor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/ai_tracker.db
      - LOG_LEVEL=INFO
    volumes:
      - auditor_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: llm_token_auditor_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  auditor_data:
    driver: local
